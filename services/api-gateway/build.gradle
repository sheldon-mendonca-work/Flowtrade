plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.flowtrade'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.flowtrade:observability:0.0.1-SNAPSHOT'

	implementation 'io.opentelemetry:opentelemetry-api:1.64.0'

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootRun {
    jvmArgs = [
        "-javaagent:/media/kloseline/D/Projects/FlowTrade/infra/openTelemetry/opentelemetry-javaagent.jar",
		"-Dotel.service.name=api-gateway",
		"-Dotel.traces.exporter=otlp",
		"-Dotel.metrics.exporter=none",
		"-Dotel.logs.exporter=none",
		"-Dotel.exporter.otlp.protocol=grpc",
		"-Dotel.exporter.otlp.endpoint=http://localhost:4317"
    ]
}